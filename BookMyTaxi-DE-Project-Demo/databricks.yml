# This is a Declarative Automation Bundle definition for BookMyTaxi.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: BookMyTaxi-DE-Project-Demo
  uuid: 4d55b278-2df1-401a-9759-2b686b423f08

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-2f7529bb-689e.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-2f7529bb-689e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pavankosuru656@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pavankosuru656@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: dlt_demo
    permissions:
      - user_name: pavankosuru656@gmail.com
        level: CAN_MANAGE
