# The main pipeline for BookMyTaxi

resources:
  pipelines:
    BookMyTaxi_etl:
      name: BookMyTaxi_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/BookMyTaxi_etl"

      libraries:
        - glob:
            include: ../src/BookMyTaxi_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
